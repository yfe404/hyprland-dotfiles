set -g mouse on

# Truecolor
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-kitty:Tc"

# ── Subtle Cyberpink status ── hexes mirror theme/cyberpink.css
set -g status-position bottom
set -g status-justify left
set -g status-left-length 30
set -g status-style "bg=#1a1025,fg=#e8e0f0"

set -g status-left "#[fg=#1a1025,bg=#e84a9c,bold] #S #[fg=#e84a9c,bg=#1a1025] "
set -g status-right "#[fg=#7dcfff]%H:%M #[fg=#1a1025,bg=#bb7dcf,bold] #h "

set -g window-status-format "#[fg=#b8b0c8] #I:#W "
set -g window-status-current-format "#[fg=#e84a9c,bold] #I:#W "
set -g window-status-activity-style "fg=#ffe066"

set -g pane-border-style "fg=#4a3f55"
set -g pane-active-border-style "fg=#e84a9c"

set -g message-style "bg=#2a1f35,fg=#e84a9c"
set -g mode-style "bg=#e84a9c,fg=#1a1025"
set -g clock-mode-colour "#e84a9c"
