set -g mouse on

# Truecolor
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-kitty:Tc"

# ── Ghost in the Shell (1995) status ── hexes mirror theme/palette.css
set -g status-position bottom
set -g status-justify left
set -g status-left-length 30
set -g status-style "bg=#0b1210,fg=#d2e8dc"

set -g status-left "#[fg=#0b1210,bg=#7af0c8,bold] #S #[fg=#7af0c8,bg=#0b1210] "
set -g status-right "#[fg=#5ecfdc]%H:%M #[fg=#0b1210,bg=#8a76b8,bold] #h "

set -g window-status-format "#[fg=#96b0a4] #I:#W "
set -g window-status-current-format "#[fg=#7af0c8,bold] #I:#W "
set -g window-status-activity-style "fg=#ffd27a"

set -g pane-border-style "fg=#2c3f36"
set -g pane-active-border-style "fg=#7af0c8"

set -g message-style "bg=#16221c,fg=#7af0c8"
set -g mode-style "bg=#7af0c8,fg=#0b1210"
set -g clock-mode-colour "#7af0c8"
