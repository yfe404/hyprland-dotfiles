# Ghost in the Shell (1995) starship prompt
# Palette hexes mirror theme/palette.css

"$schema" = 'https://starship.rs/config-schema.json'

palette = "gits95"

format = """
[╭─](overlay)$username[@](subtext)$hostname $directory$git_branch$git_status$python$nodejs$rust$cmd_duration
[╰─](overlay)$character"""

add_newline = true

[username]
show_always = true
style_user = "bold mauve"
style_root = "bold red"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "bold sky"
format = "[$hostname]($style)"

[palettes.gits95]
pink = "#7af0c8"
mauve = "#8a76b8"
red = "#ff5f6d"
green = "#66e0a3"
yellow = "#ffd27a"
sky = "#5ecfdc"
blue = "#6aaede"
lavender = "#a292cc"
text = "#d2e8dc"
subtext = "#b4ccc0"
overlay = "#4a6456"
surface = "#16221c"

[directory]
style = "bold pink"
truncation_length = 4
truncate_to_repo = true
read_only = " 󰌾"

[git_branch]
symbol = " "
style = "bold mauve"
format = "on [$symbol$branch(:$remote_branch)]($style) "

[git_status]
style = "red"
format = '([\[$all_status$ahead_behind\]]($style) )'

[python]
symbol = " "
style = "sky"
format = 'via [$symbol$pyenv_prefix($version )(\($virtualenv\) )]($style)'

[nodejs]
symbol = " "
style = "green"
format = "via [$symbol($version )]($style)"

[rust]
symbol = "󱘗 "
style = "red"
format = "via [$symbol($version )]($style)"

[cmd_duration]
min_time = 2000
style = "yellow"
format = "took [$duration]($style) "

[character]
success_symbol = "[❯](bold pink)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold mauve)"
